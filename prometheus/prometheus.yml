global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"
  
scrape_configs:
  - job_name: 'gitlab'
    metrics_path: '/-/metrics'
    params:
      token: ['g3x4hTaG8VcwnkHmhUWh']   # Otra forma de pasar el token
    static_configs:
      - targets: ['192.168.100.16:80']

  - job_name: 'grafana'
    # Grafana expone métricas en '/metrics' si está configurado
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.100.16:3000']

  - job_name: 'prometheus'
    # Prometheus expone sus propias métricas en '/metrics'
    static_configs:
      - targets: ['192.168.100.16:9000']

  - job_name: 'node_exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.100.16:9101']