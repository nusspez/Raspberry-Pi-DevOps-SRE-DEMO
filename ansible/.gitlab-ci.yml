# Definición de las etapas del pipeline
stages:
  - build
  - test
  - deploy

# Variables globales (opcional)
variables:
  PROJECT_ENV: "development"

# Trabajo para compilar el proyecto
build_job:
  stage: build
  script:
    - echo "Compilando el proyecto..."
    - echo "Compilación completada exitosamente."
  allow_failure: true

# Trabajo para ejecutar pruebas
test_job:
  stage: test
  script:
    - echo "Ejecutando pruebas..."
    - echo "Pruebas finalizadas."
  allow_failure: true

# Trabajo para desplegar el proyecto
deploy_job:
  stage: deploy
  script:
    - echo "Desplegando el proyecto..."
    - echo "Despliegue realizado correctamente."
  allow_failure: true